<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>交通标识识别调度系统</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #2980b9; }
        .status-box { padding: 15px; background: #e8f4fd; border-left: 4px solid #3498db; border-radius: 4px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        img.thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .progress-container { background: #ecf0f1; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .progress-bar { width: 0%; height: 20px; background: #2ecc71; transition: width 0.5s; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚦 交通标识批量识别调度系统</h2>

    <!-- ========== 图片上传卡片 ========== -->
    <div class="card">
        <h3>1. 批量导入图片入队</h3>
        <input type="file" id="batchInput" accept="image/*" multiple>
        <button class="btn" onclick="submitBatch()">批量上传并加入队列</button>

        <div class="status-box">
            <h4>🔄 队列调度状态 (实时更新)</h4>
            <p>正在处理的任务: <strong id="currentTask" style="color: #e74c3c;">无</strong></p>
            <p>队列中等待的任务数 (队首待命): <strong id="queueSize">0</strong></p>
        </div>
    </div>












    <!-- ========== 视频上传卡片（新增） ========== -->
    <div class="card">
        <h3>2. 上传视频进行逐帧识别</h3>
        <input type="file" id="videoInput" accept="video/*">
        <button class="btn" onclick="submitVideo()">上传并处理视频</button>
        <div id="videoProgress" style="margin-top:10px;display:none;">
            <div class="progress-container">
                <div id="videoProgressBar" class="progress-bar"></div>
            </div>
            <span id="videoProgressText">0%</span>
            <span id="videoStatusText"></span>
        </div>
    </div>






















    <!-- ========== 历史记录卡片 ========== -->
    <div class="card">
        <h3>3. 历史识别记录库 (数据库持久化)</h3>
        <input type="text" id="searchInput" placeholder="输入标签名或文件名搜索..." style="padding: 6px; width: 250px;">
        <button class="btn" onclick="fetchHistory()">搜索历史</button>
        <button class="btn" onclick="fetchHistory('')" style="background:#95a5a6;">显示全部</button>
        <button class="btn" onclick="clearAllHistory()" style="background:#e74c3c; float: right;">一键清空所有</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>缩略图</th>
                    <th>原文件名</th>
                    <th>识别结果 (Label)</th>
                    <th>置信度</th>
                    <th>处理时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================
    // 图片批量上传
    // ==========================================
    async function submitBatch() {
        const input = document.getElementById('batchInput');
        if (input.files.length === 0) return alert("请至少选择一张图片！");

        const formData = new FormData();
        for (let i = 0; i < input.files.length; i++) {
            formData.append('files', input.files[i]);
        }

        try {
            const res = await fetch('/upload_batch', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message);
            input.value = "";
        } catch (e) {
            alert("上传失败！");
        }
    }






















// ==========================================
// 视频上传与进度轮询（新增）
// ==========================================
async function submitVideo() {
    const input = document.getElementById('videoInput');
    if (!input.files.length) return alert("请选择视频文件！");

    const formData = new FormData();
    formData.append('video', input.files[0]);

    try {
        const res = await fetch('/upload_video', { method: 'POST', body: formData });
        const data = await res.json();
        const originalFilename = data.original_filename || data.task_id;  // 获取原始文件名
        if (!res.ok) {
            alert(data.error || "上传失败");
            return;
        }
        alert(data.message);

        // 显示进度条
        document.getElementById('videoProgress').style.display = 'block';
        const taskId = data.task_id;

        // 轮询进度
        const interval = setInterval(async () => {
            try {
                const statusRes = await fetch(`/video_status/${taskId}`);
                const statusData = await statusRes.json();
                if (statusData.error) {
                    clearInterval(interval);
                    return;
                }
                const progress = statusData.progress || 0;
                document.getElementById('videoProgressBar').style.width = progress + '%';
                // ===== 把文件名加到进度显示前面 =====
                document.getElementById('videoProgressText').textContent =
                    `${originalFilename}: ${statusData.processed_videos}/${statusData.total_videos} (${progress.toFixed(1)}%)`;
                if (statusData.status === 'completed') {
                    clearInterval(interval);
                    document.getElementById('videoStatusText').innerHTML =
                        `✅ 处理完成！<a href="${statusData.output_path}" target="_blank">下载视频</a>`;
                    fetchHistory(); // 刷新历史记录
                }
            } catch (e) {
                console.error("进度查询失败", e);
            }
        }, 2000);
    } catch (e) {
        alert("上传或处理出错：" + e.message);
    }
}













    // ==========================================
    // 队列状态轮询
    // ==========================================
    setInterval(async () => {
        try {
            const res = await fetch('/queue_status');
            const data = await res.json();

            document.getElementById('queueSize').innerText = data.queue_size;
            document.getElementById('currentTask').innerText = data.current_task ? data.current_task : "无 (队列空闲)";

            if (data.is_idle && window.lastStatusWasBusy) {
                fetchHistory();
            }
            window.lastStatusWasBusy = !data.is_idle;

        } catch (e) { console.error("状态获取失败", e); }
    }, 1000);

    // ==========================================
    // 历史记录查询
    // ==========================================
    async function fetchHistory(forceKeyword) {
        const keyword = forceKeyword !== undefined ? forceKeyword : document.getElementById('searchInput').value;

        try {
            const res = await fetch(`/history?keyword=${keyword}`);
            const data = await res.json();

            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = "";

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">暂无匹配的历史记录</td></tr>`;
                return;
            }

            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td><a href="${item.result_img_path}" target="_blank">
                                <img src="${item.result_img_path}" class="thumb" alt="result">
                            </a>
                        </td>
                        <td>${item.filename}</td>
                        <td style="font-weight:bold;">${item.label}</td>
                        <td>${item.confidence}</td>
                        <td><small>${item.time}</small></td>
                        <td>
                            <button onclick="deleteRecord(${item.id})" style="background:#ff7675; color:white; border:none; padding:4px 8px; border-radius:3px; cursor:pointer;">删除</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) { console.error("获取历史失败", e); }
    }

    // ==========================================
    // 删除单条记录
    // ==========================================
    async function deleteRecord(id) {
        if (!confirm(`确定要删除 ID 为 ${id} 的这条记录吗？`)) return;

        try {
            const res = await fetch(`/history/${id}`, { method: 'DELETE' });
            if (res.ok) {
                fetchHistory();
            } else {
                alert("删除失败！");
            }
        } catch (e) {
            console.error("请求报错:", e);
        }
    }

    // ==========================================
    // 清空所有记录
    // ==========================================
    async function clearAllHistory() {
        if (!confirm("危险警告：确定要清空所有历史记录和图片吗？此操作不可恢复！")) return;

        try {
            const res = await fetch('/history/all', { method: 'DELETE' });
            if (res.ok) {
                alert("已全部清空！");
                fetchHistory('');
            }
        } catch (e) {
            console.error("请求报错:", e);
        }
    }

    // 页面加载后自动拉取历史
    window.onload = () => fetchHistory('');
</script>

</body>
</html>
